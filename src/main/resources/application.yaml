spring:
  application:
    name: terminal-request-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:terminal_request_service}?currentSchema=public}
    username: ${POSTGRES_USERNAME:terminal_request_service}
    password: ${POSTGRES_PASSWORD:terminal_request_service}
    hikari:
      schema: ${POSTGRES_SCHEMA:public}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

  flyway:
    baseline-on-migrate: true
    clean-disabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %X{dd.trace_id} %X{dd.span_id} %c{1} - %m%n"

aws:
  region: ${AWS_REGION:us-east-1}
  lambda:
    enabled: ${AWS_LAMBDA_ENABLED:true}
    customer-validation-function: ${AWS_LAMBDA_CUSTOMER_VALIDATION_FUNCTION:}